<script id="playable-data" type="application/json">{}</script>
<script id="resonance-attached-template-v1-script">

const CONFIG = JSON.parse(document.getElementById("config-data").textContent);
const CORPUS = JSON.parse(document.getElementById("catalog-data").textContent);
const VECTORS = JSON.parse(document.getElementById("vector-data").textContent);
const PLAYABLE_MEDIA = JSON.parse(document.getElementById("playable-data").textContent);

const RETURN_COUNT = 10;
const EMBED_URL = "/v1/embed";

const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]),
);

let results = [];
let active = 0;
let currentQuery = "";
let coverList = [];
let coverIndex = 0;
let coverFlip = false;
let coverTimer = null;
let elapsedTimer = null;
let searchStartedAt = 0;
let placeholderTimer = null;
let placeholderIndex = 0;
let placeholderPosition = 0;
let placeholderDeleting = false;

const EXAMPLES = CONFIG.examples || [
  "a family rebuilding trust",
  "something funny but not shallow",
  "a love story with a dangerous secret",
  "justice in a lawless town",
];

function show(id) {
  $$(".plate").forEach(plate => {
    const on = plate.id === id;
    plate.classList.toggle("on", on);
    plate.setAttribute("aria-hidden", on ? "false" : "true");
  });
}

function normalizeTitle(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/\([^)]*(?:19|20)\d{2}[^)]*\)/g, " ")
    .replace(
      /\b(?:episode|ep|season|series|part|chapter|volume|vol)\s*(?:\d+|[ivxlcdm]+)\b/g,
      " ",
    )
    .replace(/\b(?:19|20)\d{2}\b/g, " ")
    .replace(/\b(?:full movie|official trailer|official|studio version)\b/g, " ")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function imageKey(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  try {
    const url = new URL(raw, location.href);
    return url.pathname.replace(/\/+$/, "").toLowerCase();
  } catch {
    return raw.split("?")[0].toLowerCase();
  }
}

function itemId(item) {
  return String(
    item?.slug ||
    item?.id ||
    item?.videoId ||
    item?.uuid ||
    item?.title ||
    "",
  );
}

function itemArt(item) {
  return (
    item?.backdrop ||
    item?.background ||
    item?.imageUrl ||
    item?.card ||
    item?.poster ||
    ""
  );
}

function itemPoster(item) {
  return (
    item?.poster ||
    item?.card ||
    item?.background ||
    item?.backdrop ||
    item?.imageUrl ||
    fallbackArt(item?.title || "Title")
  );
}

function itemGenre(item) {
  if (Array.isArray(item?.genres)) return item.genres.join(", ");
  if (Array.isArray(item?.categories)) return item.categories.join(", ");
  return String(item?.genre || item?.category || "").trim();
}

function itemYear(item) {
  const year = String(item?.year || "").trim();
  return year && year.toLowerCase() !== "hidden gem" ? year : "";
}

function itemRuntime(item) {
  return String(
    item?.runtime ||
    item?.status ||
    item?.durationLabel ||
    "",
  ).trim();
}

function itemUrl(item) {
  if (item?.url) return item.url;
  if (item?.sources) return item.sources;
  if (CONFIG.key === "angel" && item?.slug) {
    return `https://www.angel.com/watch/${encodeURIComponent(item.slug)}`;
  }
  return "#";
}

function playableFor(item) {
  return (
    item?.playable ||
    PLAYABLE_MEDIA[itemId(item)] ||
    PLAYABLE_MEDIA[item?.slug] ||
    null
  );
}

function fallbackArt(title) {
  const safe = esc(String(title || "TITLE").slice(0, 62));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#31140f"/>
        <stop offset="1" stop-color="#0A0A09"/>
      </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <text x="7%" y="74%" fill="#F6F4EF" font-family="Georgia" font-size="90">${safe}</text>
  </svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function shuffle(items) {
  const output = [...items];
  for (let index = output.length - 1; index > 0; index -= 1) {
    const swap = Math.floor(Math.random() * (index + 1));
    [output[index], output[swap]] = [output[swap], output[index]];
  }
  return output;
}

function uniqueCatalogue(items, limit = Infinity) {
  const titles = new Set();
  const images = new Set();
  const sources = new Set();
  const output = [];

  for (const item of items) {
    const title = normalizeTitle(item?.title);
    const image = imageKey(itemArt(item) || itemPoster(item));
    const source = String(
      item?.url ||
      item?.sources ||
      item?.videoId ||
      item?.slug ||
      "",
    ).toLowerCase();

    if (title && titles.has(title)) continue;
    if (image && images.has(image)) continue;
    if (source && sources.has(source)) continue;

    if (title) titles.add(title);
    if (image) images.add(image);
    if (source) sources.add(source);

    output.push(item);
    if (output.length >= limit) break;
  }

  return output;
}

function setImagePair(firstSelector, secondSelector, item, flip) {
  if (!item) return;

  const incoming = $(flip ? secondSelector : firstSelector);
  const outgoing = $(flip ? firstSelector : secondSelector);
  const source = itemArt(item) || itemPoster(item);

  const preload = new Image();
  preload.onload = () => {
    incoming.src = source;
    incoming.alt = item?.title || "";
    incoming.classList.add("on");
    outgoing.classList.remove("on");
  };
  preload.onerror = () => {
    if (coverList.length) {
      coverIndex = (coverIndex + 1) % coverList.length;
      rotateCover();
    }
  };
  preload.src = source;
}

function rotateCover() {
  if (!coverList.length) return;
  const item = coverList[coverIndex % coverList.length];
  coverIndex += 1;
  setImagePair("#coverA", "#coverB", item, coverFlip);
  coverFlip = !coverFlip;
}

function startCoverRotation() {
  coverList = uniqueCatalogue(
    shuffle(CORPUS.filter(item => itemArt(item) || itemPoster(item))),
    60,
  );
  rotateCover();
  clearInterval(coverTimer);
  coverTimer = setInterval(rotateCover, 7200);
}

function norm(vector) {
  let total = 0;
  for (let index = 0; index < vector.length; index += 1) {
    total += vector[index] * vector[index];
  }
  return Math.sqrt(total) || 1;
}

function arbiterMeasure(queryVector, candidateVector) {
  const queryNorm = norm(queryVector);
  const candidateNorm = norm(candidateVector);
  let score = 0;

  for (
    let index = 0;
    index < Math.min(queryVector.length, candidateVector.length);
    index += 1
  ) {
    score += (
      (queryVector[index] / queryNorm) *
      (candidateVector[index] / candidateNorm)
    );
  }

  return score;
}

async function embedQuery(query) {
  const response = await fetch(EMBED_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json",
    },
    body: JSON.stringify({
      texts: [query],
      use_freq: true,
    }),
  });

  if (!response.ok) {
    const body = await response.text();
    throw new Error(body || `Embedding failed (${response.status})`);
  }

  const payload = await response.json();
  const vector = payload?.vectors?.[0];

  if (!Array.isArray(vector) || vector.length !== 72) {
    throw new Error("ARBITER did not return one 72D query vector.");
  }

  return vector;
}

function rankField(queryVector) {
  const ranked = VECTORS.map((vector, index) => ({
    ...CORPUS[index],
    _catalogIndex: index,
    score: arbiterMeasure(queryVector, vector),
  })).sort((left, right) => right.score - left.score);

  return uniqueCatalogue(ranked, RETURN_COUNT);
}

function startElapsed() {
  searchStartedAt = performance.now();
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(() => {
    const elapsed = (performance.now() - searchStartedAt) / 1000;
    $("#elapsed").textContent = `${elapsed.toFixed(1)}s`;
  }, 50);
}

function stopElapsed() {
  clearInterval(elapsedTimer);
  const elapsed = (performance.now() - searchStartedAt) / 1000;
  $("#elapsed").textContent = `${elapsed.toFixed(1)}s`;
}

async function search(rawQuery) {
  const query = String(rawQuery || "").trim();
  if (!query) return;

  currentQuery = query;
  $("#query").value = query;
  $("#revealQuery").value = query;
  $("#workQuery").textContent = query;
  $("#stateText").textContent = `measuring ${CORPUS.length} titles`;

  const ambient = coverList[
    Math.floor(Math.random() * Math.max(1, coverList.length))
  ];
  setImagePair("#ambA", "#ambB", ambient, false);

  show("leader");
  startElapsed();

  try {
    const queryVector = await embedQuery(query);
    results = rankField(queryVector);
    active = 0;

    if (!results.length) {
      throw new Error("No catalogue results were returned.");
    }

    stopElapsed();
    render();
    show("reveal");
    history.replaceState(
      null,
      "",
      `${location.pathname}#${encodeURIComponent(query)}`,
    );
  } catch (error) {
    console.error(error);
    stopElapsed();
    $("#stateText").textContent = "search unavailable";
    setTimeout(() => show("landing"), 900);
  }
}

function isPosterOnly(item) {
  return !(
    item?.backdrop ||
    item?.background ||
    item?.imageUrl
  ) && Boolean(item?.poster || item?.card);
}

function render() {
  const item = results[active];
  if (!item) return;

  const fullArt = itemArt(item) || itemPoster(item);
  const posterOnly = isPosterOnly(item);
  const revealCanvas = $("#revealCanvas");

  revealCanvas.classList.toggle("square", posterOnly);
  $("#stillBg").src = fullArt;
  $("#still").src = fullArt;
  $("#still").alt = item?.title || "";
  $("#cardImg").src = itemPoster(item);
  $("#cardImg").alt = item?.title || "";

  $("#title").textContent = item?.title || "Untitled";
  $("#format").textContent = CONFIG.resultLabel;
  $("#score").textContent = Number(item.score).toFixed(3);

  const metadata = [
    itemYear(item),
    itemGenre(item),
    itemRuntime(item),
    item?.rating,
  ].filter(Boolean);

  $("#meta").innerHTML = metadata
    .slice(0, 5)
    .map(value => `<span>${esc(value)}</span>`)
    .join("");

  const description = String(
    item?.overview ||
    item?.description ||
    "",
  ).trim();

  $("#synopsis").textContent = (
    description.length > 320
      ? `${description.slice(0, 319).trimEnd()}…`
      : description
  );

  $("#pos").textContent = String(active + 1).padStart(2, "0");
  $("#total").textContent = String(results.length).padStart(2, "0");
  $("#deckCount").textContent = `${results.length} ranked titles`;

  const playable = playableFor(item);
  $("#play").hidden = !playable;
  $("#play").textContent = playable?.label || "watch";

  const url = itemUrl(item);
  $("#watch").hidden = !url || url === "#";
  $("#watch").textContent = CONFIG.openLabel;
  $("#watch").onclick = () => window.open(url, "_blank", "noopener");

  $("#copy").onclick = () => {
    const link = `${location.origin}${location.pathname}#${encodeURIComponent(currentQuery)}`;
    navigator.clipboard?.writeText(link).then(() => toast("link copied"));
  };

  renderDeck();
  autoResize($("#revealQuery"));
}

function renderDeck() {
  $("#deck").innerHTML = results.map((item, index) => `
    <button
      type="button"
      class="tile ${index === active ? "on" : ""}"
      data-index="${index}"
      aria-current="${index === active ? "true" : "false"}"
    >
      <span class="shot">
        <img
          src="${esc(itemPoster(item))}"
          alt=""
          loading="lazy"
          decoding="async"
        >
        <span class="n">${String(index + 1).padStart(2, "0")}</span>
      </span>
      <span class="cap">${esc(item?.title || "Untitled")}</span>
      <span class="sc">${Number(item.score).toFixed(3)}</span>
    </button>
  `).join("");

  $$("#deck .tile").forEach(tile => {
    tile.onclick = () => {
      active = Number(tile.dataset.index);
      closeProjector();
      render();
    };
  });

  const deck = $("#deck");
  const selected = $("#deck .tile.on");
  if (deck && selected) {
    requestAnimationFrame(() => {
      const left = (
        selected.offsetLeft -
        ((deck.clientWidth - selected.offsetWidth) / 2)
      );
      deck.scrollTo({
        left: Math.max(0, left),
        behavior: "smooth",
      });
    });
  }
}

function step(direction, options = {}) {
  if (!results.length) return;
  active = (active + direction + results.length) % results.length;
  closeProjector();
  render();
  if (options.play) openProjector();
}

function playableUrl(playable) {
  if (!playable) return "";

  if (playable.type === "youtube" && playable.id) {
    return (
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(playable.id) +
      "?autoplay=1&controls=1&rel=0&modestbranding=1&playsinline=1"
    );
  }

  if (playable.url) return playable.url;
  return "";
}

function openProjector() {
  const item = results[active];
  const playable = playableFor(item);
  const url = playableUrl(playable);

  if (!url) {
    toast("no playable media");
    return;
  }

  $("#projQ").textContent = currentQuery;
  $("#projFrame").src = url;
  $("#projector").classList.add("show");
  $("#projector").setAttribute("aria-hidden", "false");
  document.body.classList.add("playing");
}

function closeProjector() {
  $("#projFrame").src = "";
  $("#projector").classList.remove("show");
  $("#projector").setAttribute("aria-hidden", "true");
  document.body.classList.remove("playing");
}

function toast(message) {
  const existing = $(".toast");
  if (existing) existing.remove();

  const element = document.createElement("div");
  element.className = "toast";
  element.textContent = message;
  document.body.appendChild(element);

  setTimeout(() => {
    element.style.opacity = "0";
    element.style.transition = "opacity .3s";
    setTimeout(() => element.remove(), 320);
  }, 1500);
}

function autoResize(element) {
  if (!element) return;
  if (element.offsetParent === null && element.offsetHeight === 0) return;

  element.style.height = "auto";
  const maximum = parseFloat(
    getComputedStyle(element).maxHeight,
  ) || Infinity;
  element.style.height = `${Math.min(maximum, element.scrollHeight)}px`;
}

function bindInput(element, callback) {
  element.addEventListener("input", () => autoResize(element));
  element.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      callback();
    }
  });
}

function goHome() {
  closeProjector();
  show("landing");
  history.replaceState(null, "", location.pathname);
  $("#query").value = "";
  $("#revealQuery").value = "";
  autoResize($("#query"));
  startPlaceholder();
}

function startPlaceholder() {
  clearTimeout(placeholderTimer);

  const tick = () => {
    const input = $("#query");

    if (
      !$("#landing").classList.contains("on") ||
      document.activeElement === input ||
      input.value.trim()
    ) {
      placeholderTimer = setTimeout(tick, 500);
      return;
    }

    const phrase = EXAMPLES[placeholderIndex % EXAMPLES.length];

    if (!placeholderDeleting) {
      placeholderPosition += 1;
      input.setAttribute(
        "placeholder",
        phrase.slice(0, placeholderPosition),
      );

      if (placeholderPosition >= phrase.length) {
        placeholderDeleting = true;
        placeholderTimer = setTimeout(tick, 1900);
        return;
      }

      placeholderTimer = setTimeout(tick, 38);
      return;
    }

    placeholderPosition -= 1;
    input.setAttribute(
      "placeholder",
      phrase.slice(0, Math.max(0, placeholderPosition)),
    );

    if (placeholderPosition <= 0) {
      placeholderDeleting = false;
      placeholderIndex = (placeholderIndex + 1) % EXAMPLES.length;
      placeholderTimer = setTimeout(tick, 320);
      return;
    }

    placeholderTimer = setTimeout(tick, 18);
  };

  tick();
}

function voice(buttonSelector, targetSelector) {
  const SpeechRecognition = (
    window.SpeechRecognition ||
    window.webkitSpeechRecognition
  );
  const button = $(buttonSelector);
  const target = $(targetSelector);

  if (!SpeechRecognition) {
    button.hidden = true;
    return;
  }

  button.onclick = () => {
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = true;
    button.classList.add("listening");

    let finalText = "";

    recognition.onresult = event => {
      let interimText = "";

      for (
        let index = event.resultIndex;
        index < event.results.length;
        index += 1
      ) {
        const transcript = event.results[index][0].transcript;
        if (event.results[index].isFinal) {
          finalText += transcript;
        } else {
          interimText += transcript;
        }
      }

      const value = (finalText || interimText).trim();
      if (value) {
        target.value = value;
        autoResize(target);
      }
    };

    recognition.onend = recognition.onerror = () => {
      button.classList.remove("listening");
    };

    recognition.start();
  };
}

bindInput($("#query"), () => search($("#query").value));
bindInput($("#revealQuery"), () => search($("#revealQuery").value));

$("#searchForm").addEventListener("submit", event => {
  event.preventDefault();
  const input = $("#query");
  const visible = (
    input.value.trim() ||
    String(input.getAttribute("placeholder") || "").trim()
  );
  if (visible) {
    input.value = visible;
    input.setAttribute("placeholder", "");
    search(visible);
  }
});

$("#revealForm").addEventListener("submit", event => {
  event.preventDefault();
  search($("#revealQuery").value);
});

$("#home").onclick = goHome;
$("#landingHome").onclick = goHome;
$("#leaderHome").onclick = goHome;
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#play").onclick = openProjector;
$("#projClose").onclick = closeProjector;
$("#projPrev").onclick = () => step(-1, {play: true});
$("#projNext").onclick = () => step(1, {play: true});

$("#projector").addEventListener("mousemove", () => {
  const projector = $("#projector");
  projector.classList.add("show");
  clearTimeout(projector._timer);
  projector._timer = setTimeout(
    () => projector.classList.remove("show"),
    1500,
  );
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeProjector();

  if (
    !results.length ||
    document.activeElement?.tagName === "TEXTAREA"
  ) {
    return;
  }

  if (event.key === "ArrowRight") step(1);
  if (event.key === "ArrowLeft") step(-1);
});

voice("#voiceBtn", "#query");
voice("#revealVoiceBtn", "#revealQuery");

document.body.dataset.catalogue = CONFIG.key;
$("#status").textContent = `${CORPUS.length} embedded titles ready`;
startCoverRotation();
startPlaceholder();

const hashQuery = decodeURIComponent(location.hash.replace(/^#/, ""));
if (hashQuery) search(hashQuery);

</script>
